moveit_servo:
  publish_period: 0.01
  max_expected_latency: 0.1

  move_group_name: right_arm
  planning_group_name: right_arm
  active_subgroup: ""

  command_in_type: speed_units
  scale:
    linear: 0.12
    rotational: 0.35
    joint: 0.4

  cartesian_command_in_topic: /g1_servo/delta_twist_cmds
  joint_command_in_topic: /g1_servo/delta_joint_cmds
  pose_command_in_topic: /g1_servo/pose_target_cmds
  status_topic: /g1_servo/status
  joint_topic: /joint_states

  command_out_topic: /g1_right_arm_controller/joint_trajectory
  command_out_type: trajectory_msgs/JointTrajectory
  publish_joint_positions: true
  publish_joint_velocities: true
  publish_joint_accelerations: false

  incoming_command_timeout: 0.25
  apply_twist_commands_about_ee_frame: true

  # G1 默认站立右臂姿态接近 KDL 对这个 7DoF 链的奇异区。
  # 阈值太低时 Servo 会在手臂还没动起来前直接 emergency stop，
  # 表现就是状态机一直发 IK，但 right_rubber_hand 完全不动。
  # 演示里速度已经由状态机限得很小，所以这里放宽保护，让 Servo
  # 允许从默认姿态缓慢离开奇异区。若后续换成更可靠的预展开姿态，
  # 可以再把这两个值收紧。
  lower_singularity_threshold: 10000.0
  hard_stop_singularity_threshold: 20000.0
  leaving_singularity_threshold_multiplier: 2.0
  joint_limit_margins: [0.08]

  use_smoothing: true
  smoothing_filter_plugin_name: online_signal_smoothing::AccelerationLimitedPlugin
  update_period: 0.01

  is_primary_planning_scene_monitor: true
  monitored_planning_scene_topic: /planning_scene
  check_octomap_collisions: false
  check_collisions: false
  collision_check_rate: 10.0
  self_collision_proximity_threshold: 0.01
  scene_collision_proximity_threshold: 0.02
