right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.20
  kinematics_solver_attempts: 12
  # 按按钮只关心末端工具点能不能到柜面，不要求手腕姿态完全一致。
  # 位置 IK 比完整 6D pose IK 更适合 G1 这种无手掌、手腕姿态定义不稳定的 demo。
  position_only_ik: true
